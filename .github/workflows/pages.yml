name: Build and publish job board

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Backfill the complete autumn campus search index (uses more API calls)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh campus sources
        if: github.event_name != 'push' && (vars.OFFER_PUBLICATION_APPROVED == 'true' || vars.XIXICC_REUSE_APPROVED == 'true')
        env:
          OFFER_CAMPUS_API_KEY: ${{ secrets.OFFER_CAMPUS_API_KEY }}
          OFFER_PUBLICATION_APPROVED: ${{ vars.OFFER_PUBLICATION_APPROVED }}
          XIXICC_REUSE_APPROVED: ${{ vars.XIXICC_REUSE_APPROVED }}
          FULL_SYNC: ${{ inputs.full_sync || 'false' }}
        run: npm run update:data
      - run: npm run check:data
      - name: Save refreshed JSON
        if: github.event_name != 'push' && (vars.OFFER_PUBLICATION_APPROVED == 'true' || vars.XIXICC_REUSE_APPROVED == 'true')
        run: |
          if ! git diff --quiet -- public/jobs.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/jobs.json
            git commit -m 'Update campus job data'
            git push
          fi
      - name: Build site
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
